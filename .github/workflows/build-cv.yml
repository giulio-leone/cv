name: Build CV PDFs

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX documents
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            src/cv-it.tex
            src/cv-en.tex
          working_directory: .
          args: -interaction=nonstopmode -output-directory=output

      - name: Rename output PDFs
        run: |
          mv output/cv-it.pdf output/giulio-leone-cv-it.pdf
          mv output/cv-en.pdf output/giulio-leone-cv-en.pdf

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            output/giulio-leone-cv-it.pdf
            output/giulio-leone-cv-en.pdf

      - name: Commit updated PDFs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*.pdf
          git diff --staged --quiet || git commit -m "ci: auto-build CV PDFs [skip ci]"
          git push

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
      - name: Download PDF artifacts
        uses: actions/download-artifact@v4
        with:
          name: cv-pdfs
          path: output/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cv-${{ github.run_number }}
          name: CV Build #${{ github.run_number }}
          body: |
            Automated CV build from commit ${{ github.sha }}.
            
            📄 **Downloads:**
            - `giulio-leone-cv-en.pdf` — English version
            - `giulio-leone-cv-it.pdf` — Italian version
          files: |
            output/giulio-leone-cv-en.pdf
            output/giulio-leone-cv-it.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
